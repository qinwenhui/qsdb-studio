name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm --prefix ui ci

      - run: npm run tauri build

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-release/
          Copy-Item target/release/bundle/msi/*.msi dist-release/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qsdb-studio-windows
          if-no-files-found: error
          path: dist-release/*

  build-macos:
    name: macOS universal DMG (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal .app/.dmg for Apple Silicon and Intel.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm --prefix ui ci

      # Signing/notarization is intentionally out of scope for now (no Apple
      # Developer secrets in this repository). The artifact is unsigned.
      - name: Build unsigned universal DMG
        run: npm run tauri build -- --ci --target universal-apple-darwin --bundles dmg

      - name: Collect macOS artifacts
        shell: bash
        run: |
          mkdir -p dist-macos
          find target -type f -path '*/bundle/dmg/*.dmg' -exec cp {} dist-macos/ \;
          test -n "$(find dist-macos -maxdepth 1 -name '*.dmg' -print -quit)" || {
            echo 'No macOS DMG produced'; exit 1;
          }
          printf '%s\n' \
            'This macOS build is unsigned (no Apple Developer ID / notarization).' \
            '' \
            'macOS Gatekeeper may warn on first launch. To open it, use' \
            'System Settings -> Privacy & Security -> Open Anyway, or right-click the app' \
            'and choose Open. Signed/notarized builds are planned; see the repository docs.' \
            > dist-macos/MACOS-UNSIGNED.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qsdb-studio-macos
          if-no-files-found: error
          path: dist-macos/*

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qsdb-studio-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum --text > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.dmg
            release-assets/MACOS-UNSIGNED.txt
            release-assets/SHA256SUMS.txt
