name: Bug report
description: Report a reproducible problem in QSDB Studio
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security issues, follow SECURITY.md and
        email the maintainer instead of opening a public issue.

  - type: input
    id: studio-version
    attributes:
      label: Studio version
      description: Shown in the About panel or as `Studio v...` in the status bar.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: qsdb-version
    attributes:
      label: QSDB server version
      description: Shown in the top bar after connecting, or from the server CLI.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the minimal SQL, connection mode, and UI path.
      placeholder: |
        1. Connect with a Basic profile
        2. Open...
        3. Run...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error codes, HTTP status, and the exact message.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: |
        Remove passwords, tokens, connection URLs, customer data, and internal
        hostnames before pasting.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: redaction
    attributes:
      label: Sensitive data
      options:
        - label: I removed credentials, connection URLs, and sensitive data from this report.
          required: true
