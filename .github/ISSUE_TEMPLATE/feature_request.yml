name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow and the friction, not only the proposed UI.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Mention alternatives you considered.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Query workbench
        - Catalog / metadata tree
        - File manager
        - Sessions / operations
        - Grants / configuration
        - Import / export
        - Appearance / accessibility
        - Packaging / distribution
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, QSDB server behavior, or related issues.
    validations:
      required: false
